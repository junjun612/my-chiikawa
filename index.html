<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나만의 먼작귀 만들기</title>
<meta name="description" content="질문 8개로 만나는 나를 닮은 먼작귀">
<meta name="theme-color" content="#bfe3f6">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="design/icon-512.png">
<link rel="apple-touch-icon" href="design/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="나만의 먼작귀 만들기">
<meta property="og:description" content="질문 8개로 만나는 나를 닮은 먼작귀">
<meta property="og:url" content="https://junjun612.github.io/my-chiikawa/">
<meta property="og:image" content="https://junjun612.github.io/my-chiikawa/design/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="나만의 먼작귀 만들기">
<meta name="twitter:description" content="질문 8개로 만나는 나를 닮은 먼작귀">
<meta name="twitter:image" content="https://junjun612.github.io/my-chiikawa/design/og.jpg">
<link rel="preload" href="fonts/Jua.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Dongle-Bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/GowunDodum.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="creature.css?v=20261020b">
<link rel="stylesheet" href="test.css?v=20261020b">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Wobbly hand-drawn outlines for cards and buttons -->
  <filter id="wobble"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.5L12 16.6 6.2 20.1l1.6-6.5L2.7 9.2l6.7-.5z" fill="#ffe27a" stroke="#6b4a3a" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="spark" viewBox="0 0 24 24"><path d="M12 1c.6 6 4 9.6 11 11-7 1.4-10.4 5-11 11-.6-6-4-9.6-11-11 7-1.4 10.4-5 11-11z" fill="#ffd95e"/></symbol>
</svg>

<main class="page">
  <!-- 1. Intro -->
  <section class="screen on" id="intro">
    <div class="parade" aria-hidden="true"><div class="parade-track" id="parade"></div></div>
    <h1 class="title">
      <svg class="spark s1"><use href="#spark"/></svg>
      나만의 먼작귀<br>만들기
      <svg class="spark s2"><use href="#spark"/></svg>
    </h1>
    <p class="card sketch intro-desc">작은 질문 여덟 개에 답하면<br>나를 꼭 닮은 먼작귀가 태어나요</p>
    <button class="btn pink sketch big" id="startBtn">시작하기 <svg class="ico"><use href="#star"/></svg></button>
  </section>

  <!-- 2. Name / birthday -->
  <section class="screen" id="info">
    <div class="peek" id="peekStage" aria-hidden="true"></div>
    <form class="card sketch form" id="infoForm" novalidate>
      <h2 class="h2">너에 대해 알려 줘!</h2>
      <label class="field">
        <span>이름</span>
        <input id="nameIn" maxlength="10" autocomplete="nickname" placeholder="예) 지민" required>
      </label>
      <label class="field">
        <span>생년월일</span>
        <input id="birthIn" type="text" inputmode="numeric" autocomplete="bday" maxlength="10" placeholder="예) 1998.04.12" required>
      </label>
      <p class="err" id="infoErr" role="alert"></p>
      <button class="btn pink sketch" type="submit">다음으로</button>
    </form>
    <button class="link" data-go="intro">처음으로</button>
  </section>

  <!-- 3. Quiz -->
  <section class="screen" id="quiz">
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="card sketch qcard">
      <p class="qnum" id="qNum"></p>
      <div class="mini-wrap"><div class="mini" id="quizStage"></div></div>
      <h2 class="h2 qtext" id="qText"></h2>
      <div class="answers" id="answers"></div>
    </div>
    <button class="link" id="quizBack">이전 질문</button>
  </section>

  <!-- 4. Making... -->
  <section class="screen" id="making">
    <div class="making">
      <div class="dough" aria-hidden="true"></div>
      <p class="h2">먼작귀를 빚는 중…</p>
      <p class="sub" id="makingSub">말랑말랑 반죽 중</p>
    </div>
  </section>

  <!-- 5. Result -->
  <section class="screen" id="result">
    <p class="owner" id="owner"></p>
    <div class="result-card sketch">
      <div class="stage-wrap" id="resultWrap"><div class="stage" id="resultStage"></div></div>
      <div class="bg-pick" id="bgPick" role="radiogroup" aria-label="배경 고르기"></div>
      <div class="result-text">
        <p class="type" id="rType"></p>
        <h2 class="cname" id="rName"></h2>
        <p class="desc" id="rDesc"></p>
        <ul class="tags" id="rTags"></ul>
        <p class="birth" id="rBirth"></p>
      </div>
    </div>
    <div class="icon-row">
      <button class="ibtn" id="rerollBtn" aria-haspopup="dialog">
        <span class="disc mint sketch"><svg viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3M19.5 4v4.5H15"/></svg></span>
        <span class="lbl">다시</span>
      </button>
      <button class="ibtn" id="saveBtn">
        <span class="disc pink sketch"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10.5l5 5 5-5M5 19.5h14"/></svg></span>
        <span class="lbl">저장</span>
      </button>
      <button class="ibtn" id="shareBtn">
        <span class="disc kakao sketch"><svg viewBox="0 0 24 24"><path class="fill" d="M12 4.5c-4.7 0-8.5 3-8.5 6.6 0 2.3 1.5 4.3 3.8 5.5l-.9 3.3 3.8-2.5c.6.1 1.2.1 1.8.1 4.7 0 8.5-3 8.5-6.6S16.7 4.5 12 4.5z"/></svg></span>
        <span class="lbl">공유</span>
      </button>
    </div>
    <div class="row small">
      <a class="link" id="editLink" href="maker.html">직접 꾸미기</a>
      <button class="link" data-go="intro" id="restartBtn">처음부터 다시</button>
    </div>
  </section>
</main>

<dialog class="roll-pop sketch" id="rollPop" aria-labelledby="rollTitle">
  <p class="h2" id="rollTitle">어떻게 돌려 볼까?</p>
  <button class="btn mint sketch" data-mode="mine">내 성향대로<small>나랑 닮은 친구 중에서</small></button>
  <button class="btn pink sketch" data-mode="any">완전 랜덤<small>아무나 나와라!</small></button>
  <button class="link" data-mode="">그만두기</button>
</dialog>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.4/kakao.min.js" integrity="sha384-BGX7Wb16GmRFagri4bLJV2DgipVZaU2AI812GZtHtHzzDQJnfHasDXN5houxv45w" crossorigin="anonymous"></script>
<script src="config.js?v=20261020b"></script>
<script src="parts.js?v=20261020b"></script>
<script src="engine.js?v=20261020b"></script>
<script src="quiz-data.js?v=20261020b"></script>
<script src="test.js?v=20261020b"></script>
</body>
</html>
